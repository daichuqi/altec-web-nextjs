name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.ALIYUN_SITE_URL || 'https://www.altec-sz.com' }}
          NEXT_PUBLIC_DOWNLOADS_CDN_BASE_URL: ${{ vars.NEXT_PUBLIC_DOWNLOADS_CDN_BASE_URL || vars.ALIYUN_DOWNLOADS_CDN_BASE_URL }}
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.sha }}
        run: npm run verify

      - name: Guard static deploy
        run: |
          test -d out
          test -f out/index.html

      - name: Sync exported site to OSS
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.ALIYUN_SITE_URL || 'https://www.altec-sz.com' }}
          ALIYUN_SITE_URL: ${{ vars.ALIYUN_SITE_URL }}
        run: npm run sync:site:oss

      - name: Smoke test Aliyun OSS objects
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
        run: |
          set -euo pipefail

          if [[ -z "${ALIYUN_OSS_BUCKET:-}" || -z "${ALIYUN_OSS_ENDPOINT:-}" ]]; then
            echo "Aliyun OSS smoke failed: missing ALIYUN_OSS_BUCKET/ALIYUN_OSS_ENDPOINT."
            exit 1
          fi

          ENDPOINT="${ALIYUN_OSS_ENDPOINT#https://}"
          ENDPOINT="${ENDPOINT#http://}"
          OSS_ORIGIN="https://${ALIYUN_OSS_BUCKET}.${ENDPOINT}"
          PREFIX="${ALIYUN_OSS_PREFIX:-}"
          PREFIX="${PREFIX%/}"
          if [[ -n "${PREFIX}" ]]; then
            OSS_ORIGIN="${OSS_ORIGIN}/${PREFIX}"
          fi

          fetch_with_wait() {
            local url="$1"
            local output="$2"
            for attempt in {1..8}; do
              if curl -fsS --connect-timeout 20 --retry 2 --retry-delay 5 --retry-all-errors "${url}" >"${output}"; then
                return 0
              fi
              echo "Waiting for Aliyun DNS/CDN propagation: ${url} (attempt ${attempt}/8)"
              sleep 8
            done
            return 1
          }

          fetch_with_wait "${OSS_ORIGIN}/index.html" /tmp/alitech-oss-home.html
          fetch_with_wait "${OSS_ORIGIN}/products/al808" /tmp/alitech-oss-al808.html
          fetch_with_wait "${OSS_ORIGIN}/en/products/pc900" /tmp/alitech-oss-pc900-en.html
          fetch_with_wait "${OSS_ORIGIN}/altec/images/applications/details/TC950/TC950_Wind.gif" /tmp/alitech-oss-tc950.gif
          fetch_with_wait "${OSS_ORIGIN}/altec/downloads/TC950.pdf" /tmp/alitech-oss-tc950.pdf

          grep -q "ALTEC" /tmp/alitech-oss-home.html
          grep -q "AL808" /tmp/alitech-oss-al808.html
          grep -q "PC900" /tmp/alitech-oss-pc900-en.html

          curl -fsSI "${OSS_ORIGIN}/altec/images/optimized/${GITHUB_SHA}/products/AL808-640.avif" | tee /tmp/alitech-oss-image-headers.txt
          grep -qi "cache-control:.*max-age=31536000" /tmp/alitech-oss-image-headers.txt

          curl -fsSI "${OSS_ORIGIN}/altec/downloads/TC950.pdf" | tee /tmp/alitech-oss-download-headers.txt
          grep -qi "cache-control:.*max-age=2592000" /tmp/alitech-oss-download-headers.txt
          grep -qi "content-length:" /tmp/alitech-oss-download-headers.txt

      - name: Smoke test production domain
        env:
          ALIYUN_SITE_URL: ${{ vars.ALIYUN_SITE_URL }}
          ALIYUN_DOWNLOADS_CDN_BASE_URL: ${{ vars.NEXT_PUBLIC_DOWNLOADS_CDN_BASE_URL || vars.ALIYUN_DOWNLOADS_CDN_BASE_URL }}
          ALIYUN_PRODUCTION_SMOKE_REQUIRED: ${{ vars.ALIYUN_PRODUCTION_SMOKE_REQUIRED }}
        run: |
          set -euo pipefail

          if [[ -z "${ALIYUN_SITE_URL:-}" ]]; then
            echo "Skip production smoke test: missing ALIYUN_SITE_URL repository variable."
            exit 0
          fi

          fetch_with_wait() {
            local url="$1"
            local output="$2"
            for attempt in {1..8}; do
              if curl -fsS --connect-timeout 20 --retry 2 --retry-delay 5 --retry-all-errors "${url}" >"${output}"; then
                return 0
              fi
              echo "Waiting for Aliyun DNS/CDN propagation: ${url} (attempt ${attempt}/8)"
              sleep 8
            done
            return 1
          }

          run_production_smoke() {
            fetch_with_wait "${ALIYUN_SITE_URL}/" /tmp/alitech-home.html
            fetch_with_wait "${ALIYUN_SITE_URL}/products/al808" /tmp/alitech-al808.html
            fetch_with_wait "${ALIYUN_SITE_URL}/en/products/pc900" /tmp/alitech-pc900-en.html
            fetch_with_wait "${ALIYUN_SITE_URL}/altec/images/applications/details/TC950/TC950_Wind.gif" /tmp/alitech-tc950.gif
            fetch_with_wait "${ALIYUN_SITE_URL}/altec/downloads/TC950.pdf" /tmp/alitech-tc950.pdf
            grep -q "ALTEC" /tmp/alitech-home.html
            grep -q "AL808" /tmp/alitech-al808.html
            grep -q "PC900" /tmp/alitech-pc900-en.html

            curl -fsSI "${ALIYUN_SITE_URL}/altec/images/optimized/${GITHUB_SHA}/products/AL808-640.avif" | tee /tmp/alitech-image-headers.txt
            grep -qi "cache-control:.*max-age=31536000" /tmp/alitech-image-headers.txt

            DOWNLOADS_HOST="${ALIYUN_DOWNLOADS_CDN_BASE_URL:-$ALIYUN_SITE_URL}"
            curl -fsSI "${DOWNLOADS_HOST}/altec/downloads/TC950.pdf" | tee /tmp/alitech-download-headers.txt
            grep -qi "cache-control:.*max-age=2592000" /tmp/alitech-download-headers.txt
            grep -qi "content-length:" /tmp/alitech-download-headers.txt
          }

          if run_production_smoke; then
            echo "Production smoke test passed."
          elif [[ "${ALIYUN_PRODUCTION_SMOKE_REQUIRED:-}" == "true" ]]; then
            echo "Production smoke test failed and ALIYUN_PRODUCTION_SMOKE_REQUIRED=true."
            exit 1
          else
            echo "::warning::Production smoke test failed. OSS deploy is valid, but ${ALIYUN_SITE_URL} is not serving the uploaded OSS/CDN assets yet."
          fi
