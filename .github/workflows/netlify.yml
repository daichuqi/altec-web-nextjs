name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard static deploy
        run: |
          test -d out
          test -f out/index.html
          test ! -d .netlify/functions
          test ! -d .netlify/functions-internal
          test ! -d .netlify/edge-functions

      - name: Deploy
        run: npx netlify deploy --prod --no-build --dir out --site 0a7fa9b6-ec81-4f21-ad30-1c14265bd68f --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Sync static assets to CDN
        env:
          CDN_S3_BUCKET: ${{ secrets.CDN_S3_BUCKET }}
          CDN_S3_PREFIX: ${{ secrets.CDN_S3_PREFIX }}
          CDN_AWS_REGION: ${{ secrets.CDN_AWS_REGION }}
          CDN_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CDN_CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.CDN_AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CDN_S3_BUCKET:-}" || -z "${CDN_AWS_REGION:-}" || -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "CDN sync skipped: missing CDN_S3_BUCKET/CDN_AWS_REGION/CDN_AWS_ACCESS_KEY_ID/CDN_AWS_SECRET_ACCESS_KEY."
            exit 0
          fi

          export AWS_DEFAULT_REGION="${CDN_AWS_REGION}"

          TARGET_PREFIX="${CDN_S3_PREFIX:-}"
          TARGET_PREFIX="${TARGET_PREFIX%/}"
          if [[ -n "${TARGET_PREFIX}" ]]; then
            DEST_PREFIX="s3://${CDN_S3_BUCKET}/${TARGET_PREFIX}"
          else
            DEST_PREFIX="s3://${CDN_S3_BUCKET}"
          fi

          aws s3 sync out/_next/static "${DEST_PREFIX}/_next/static" --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out/altec "${DEST_PREFIX}/altec" --delete --cache-control "public,max-age=2592000,stale-while-revalidate=604800"

          if [[ -n "${CDN_CLOUDFRONT_DISTRIBUTION_ID:-}" ]]; then
            aws cloudfront create-invalidation --distribution-id "${CDN_CLOUDFRONT_DISTRIBUTION_ID}" --paths "/_next/*" "/altec/*" >/tmp/cf-invalidation.json
          else
            echo "CloudFront invalidation skipped: CDN_CLOUDFRONT_DISTRIBUTION_ID is not set."
          fi

      - name: Smoke test production
        run: |
          fetch_with_wait() {
            local url="$1"
            local output="$2"
            for attempt in {1..6}; do
              if curl -fsS --connect-timeout 20 --retry 2 --retry-delay 5 --retry-all-errors "$url" >"$output"; then
                return 0
              fi
              echo "Waiting for production DNS/CDN propagation: $url (attempt $attempt/6)"
              sleep 10
            done
            return 1
          }

          fetch_with_wait https://altec.daichuqi.com/ /tmp/altec-home.html
          fetch_with_wait https://altec.daichuqi.com/products/th136 /tmp/altec-th136.html
          fetch_with_wait https://altec.daichuqi.com/applications/control-basics /tmp/altec-app-control.html
          fetch_with_wait https://altec.daichuqi.com/en/applications/tc950-tension-control-applications /tmp/altec-app-tc950-en.html
          fetch_with_wait https://altec.daichuqi.com/altec/details/TH136/TH136_Panel.gif /tmp/altec-th136-panel.gif
          fetch_with_wait https://altec.daichuqi.com/altec/applications/details/TC950/TC950_Wind.gif /tmp/altec-tc950-application.gif
          grep -q "ALTEC" /tmp/altec-home.html
          grep -q "完整技术资料" /tmp/altec-th136.html
          grep -q "工业过程控制常用名词解释" /tmp/altec-app-control.html
          grep -q "TC950 Tension Controller Applications" /tmp/altec-app-tc950-en.html

      - name: Verify Netlify deploy health
        run: |
          npx netlify api getSite --data '{"site_id":"0a7fa9b6-ec81-4f21-ad30-1c14265bd68f"}' --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-site.json
          npx netlify api getSiteFileByPathName --data '{"site_id":"0a7fa9b6-ec81-4f21-ad30-1c14265bd68f","file_path":"/index.html"}' --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-index.json
          npx netlify api getSiteFileByPathName --data '{"site_id":"0a7fa9b6-ec81-4f21-ad30-1c14265bd68f","file_path":"/products/th136.html"}' --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-th136.json
          npx netlify api getSiteFileByPathName --data '{"site_id":"0a7fa9b6-ec81-4f21-ad30-1c14265bd68f","file_path":"/applications/control-basics.html"}' --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-app-control.json
          node - <<'NODE'
          const fs = require("node:fs");
          const site = JSON.parse(fs.readFileSync("/tmp/netlify-site.json", "utf8"));
          const index = JSON.parse(fs.readFileSync("/tmp/netlify-index.json", "utf8"));
          const th136 = JSON.parse(fs.readFileSync("/tmp/netlify-th136.json", "utf8"));
          const appControl = JSON.parse(fs.readFileSync("/tmp/netlify-app-control.json", "utf8"));
          const deploy = site.published_deploy;

          if (site.state !== "current") throw new Error(`Unexpected site state: ${site.state}`);
          if (site.custom_domain !== "altec.daichuqi.com") throw new Error(`Unexpected production domain: ${site.custom_domain}`);
          if (!deploy || deploy.state !== "ready") throw new Error(`Published deploy is not ready: ${deploy?.state}`);
          if (deploy.available_functions?.length) throw new Error(`Unexpected functions deployed: ${deploy.available_functions.join(", ")}`);
          if (deploy.edge_functions_present) throw new Error("Unexpected edge functions deployed");
          if (!index?.path?.endsWith("/index.html")) throw new Error("Missing deployed /index.html");
          if (!th136?.path?.endsWith("/products/th136.html")) throw new Error("Missing deployed /products/th136.html");
          if (!appControl?.path?.endsWith("/applications/control-basics.html")) throw new Error("Missing deployed /applications/control-basics.html");
          if (!deploy.screenshot_url) console.warn("Netlify deploy screenshot is not available yet");
          NODE
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
