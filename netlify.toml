[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/gallery"
  to = "/products"
  status = 301

[[redirects]]
  from = "/en/gallery"
  to = "/en/products"
  status = 301

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/altec/products/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/altec/details/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/altec/applications/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/altec/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"
